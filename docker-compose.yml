version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: smart-leads-mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: smart-leads
    volumes:
      - mongo_data:/data/db
    networks:
      - smart-leads-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smart-leads-server
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/smart-leads
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_in_production}
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - smart-leads-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart-leads-client
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server
    networks:
      - smart-leads-network
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local

networks:
  smart-leads-network:
    driver: bridge
